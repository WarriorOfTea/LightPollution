[project]
name = "lightpollution"
version = "0.4.0"
description = "Local numerical skyglow planner with reproducible NASA inputs and observation scenarios"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1,<3",
    "h5py>=3.12,<4",
    "matplotlib>=3.9,<4",
    "requests>=2.32,<3",
    "astropy>=7,<9",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
]

[project.scripts]
lightpollution = "lightpollution.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pypdf>=5,<7",
    "reportlab>=4.2,<5",
    "httpx2>=2,<3",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
